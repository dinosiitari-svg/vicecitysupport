[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Force the bare domain (no www) so Google sees one version of each page.
[[redirects]]
  from = "https://www.vicecitysupport.com/*"
  to = "https://vicecitysupport.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
