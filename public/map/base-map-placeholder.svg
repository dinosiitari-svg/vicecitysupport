<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 4096" width="4096" height="4096" role="img" aria-label="Placeholder map grid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c20"/>
      <stop offset="1" stop-color="#0a0710"/>
    </linearGradient>
    <pattern id="fine" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0v128" fill="none" stroke="#19e3ff" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
    <pattern id="coarse" width="512" height="512" patternUnits="userSpaceOnUse">
      <path d="M512 0H0v512" fill="none" stroke="#ff2e97" stroke-opacity="0.22" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="4096" height="4096" fill="url(#bg)"/>
  <rect width="4096" height="4096" fill="url(#fine)"/>
  <rect width="4096" height="4096" fill="url(#coarse)"/>
  <rect x="6" y="6" width="4084" height="4084" fill="none" stroke="#ff2e97" stroke-opacity="0.5" stroke-width="8"/>

  <g font-family="Avenir Next, Futura, Trebuchet MS, sans-serif" text-anchor="middle">
    <text x="2048" y="1960" fill="#ff2e97" font-size="150" font-weight="700" font-style="italic" opacity="0.92">
      BASE MAP NOT INSTALLED
    </text>
    <text x="2048" y="2110" fill="#a99fbb" font-size="88">
      Drop your map image in  public/map/base-map.jpg
    </text>
    <text x="2048" y="2240" fill="#a99fbb" font-size="72" opacity="0.8">
      Markers below are positioned by percentage, so they survive the swap.
    </text>
  </g>

  <g font-family="monospace" fill="#a99fbb" font-size="64" opacity="0.55">
    <text x="60"   y="110">0%, 0%</text>
    <text x="4036" y="110"  text-anchor="end">100%, 0%</text>
    <text x="60"   y="4020">0%, 100%</text>
    <text x="4036" y="4020" text-anchor="end">100%, 100%</text>
  </g>
</svg>
